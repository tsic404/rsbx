# rsbx — a shell whose view of the machine is the daemon's, except for the
# programs and paths explicitly listed under [local].
#
# The entry shell runs locally. Its exact loader/library dependencies are
# compiled and served read-only; no whole host library or PATH directory is
# exposed implicitly. Every other named command is routed to the daemon.

[daemon]
# "unix"  : rsbxd listens on a socket on this machine
# "ssh"   : rsbxd is started by ssh and speaks over its stdio
transport = "unix"
socket    = "~/.rsbx/daemon.sock"

[local]
# -- which programs run HERE --
#
# Entries are expanded once into exact executable identities. A directory or
# glob is a startup snapshot, not permission for future files in that tree.
# Interpreter/runtime dependencies are compiled with each program; they do
# not authorize independent interpreter commands such as node -e.
# A remote command cannot see local.paths. Do not upload local configuration
# or silently run an unlisted command locally to work around that boundary.
allow = []

# The explicit entry is another local program, with the same dependency and
# immutable-snapshot requirements. It need not be repeated in local.allow.
entry = "/bin/sh"

# An agent runs its tools through a command shell. If that shell is not listed
# here it executes on the daemon, and every allowlisted program it calls by
# absolute path fails there with ENOENT — the binary exists only on this
# machine. List the shell when a local program must be reachable from a tool
# invocation:
#
#   allow = ["/bin/sh", "/bin/bash", "/usr/local/bin/multica"]
#
# rsbx warns at startup when an allowlisted program is absent from the daemon
# or when no shell is allowlisted, because both make the failure look like a
# missing binary rather than a placement decision.

# -- which files are LOCAL --
# Configuration/state trees read and written on this machine. Programs running
# on the daemon see only the daemon's native tree. These grants do not permit
# executing new code created under a writable configuration directory.
paths = []

# Explicit read-only local resource trees. Shared libraries required by the
# selected local programs are already compiled as exact read-only assets;
# use this only for extra resources such as an agent's installed package data.
read_only_paths = []

# There is no [remote] table and no daemon-side root. rsbxd runs on the remote
# host and its / is that machine's own root: a path you see in the sandbox is a
# path the daemon can open, sent verbatim.

[sandbox]
# These are base directories; each invocation owns unique children. They must
# not overlap local content trees, including through symlink aliases.
mount = "~/.rsbx/sandbox"
# Disposable session scratch and a verified read-only native executable cache.
# It contains no copied remote project tree. Do not delete it during a session.
cache = "~/.rsbx/cache"
# Inside a container that cannot create a nested user namespace, use false.
# Mount/PID/IPC/UTS isolation and execution restrictions remain mandatory.
# unshare_user = false
