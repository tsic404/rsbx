# rsbx — a shell whose view of the machine is the daemon's, except for the
# programs and paths explicitly listed under [local].
#
# The defaults need no configuration: /bin/sh (the entry shell) is the only
# local executable, every other command runs on the daemon, and no host
# library or /usr/bin tree is pulled in implicitly. This file just names the
# socket; everything commented out is the default.

[daemon]
# "unix"  : rsbxd listens on a socket on this machine
# "ssh"   : rsbxd is started by ssh and speaks over its stdio
transport = "unix"
socket    = "~/.rsbx/daemon.sock"

[local]
# -- which programs run HERE --
#
# By default this list is empty. The only local command is local.entry below;
# everything else — /bin/ls, /bin/cat, a shell tool, a coding agent — executes
# on the daemon under its own filesystem view. That is the intended default,
# and it is not a privilege question: the daemon's / is the machine you are
# reaching, so ordinary commands and the project tree live there naturally.
#
# Add a program only when it must read local content. A daemon-side program
# cannot see a [local.paths] tree, because the two sides have different
# filesystem views. When such a tool fails, the sandbox says so:
#
#   rsbx: stat ran on the daemon and cannot see the local tree /work/a.txt;
#         add /usr/bin/stat to local.allow to run it here instead
allow = []

# The shell the session starts. It runs locally by definition, so it does not
# need to be repeated in local.allow; a path outside a local tree would fail at
# start-up, which is the error that rule exists to prevent.
entry = "/bin/sh"

# -- which files are LOCAL --
# Trees read and written on this machine. A redirected program on the daemon
# cannot see them at all. Empty by default: the client's filesystem is the
# daemon's, except for these trees and local.allow's executable bytes.
paths = []

# Toolchain and device trees, served locally, read-only. Empty by default; add
# a directory here only to make it local on purpose, never to reconstruct the
# host /usr or library tree that the daemon already serves.
read_only_paths = []

# There is no [remote] table and no daemon-side root. rsbxd runs on the remote
# host and its / is that machine's own root: a path you see in the sandbox is a
# path the daemon can open, sent verbatim.

[sandbox]
mount = "~/.rsbx/sandbox"
# Disposable runtime scratch the client stages transient data in. It is not a
# snapshot of remote files and nothing is ever served from it, so deleting it
# only costs the client re-staging what it needs.
cache = "~/.rsbx/cache"
# Agents talk to their APIs, so they need the network.
# share_network = false
# Inside a container the runtime has already created a user namespace; nested
# creation is refused on some hosts, so set unshare_user = false there.
# unshare_user = false