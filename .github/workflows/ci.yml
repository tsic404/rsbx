name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Publishing the image needs a writable package scope. Without it the token
  # is read-only and ghcr answers "installation not allowed to Create
  # organization package", which reads like a repository setting but is really
  # this block.
  packages: write

jobs:
  test:
    name: build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "these files are not gofmt'd:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # The sandbox itself needs unprivileged user namespaces and /dev/fuse,
      # which a normal runner does not provide. The unit tests cover the
      # policies and the protocol, so they run here; the sandbox test runs in
      # the docker job below, where the container can be given the devices.
      # The mount-backed tests in internal/fusefs need /dev/fuse, which this
      # runner does not have; they skip here and run for real in the docker job.
      # The mount-backed tests in internal/fusefs need /dev/fuse, which this
      # runner does not have; they skip here and run for real in the docker job.
      - name: go test
        run: go test -race ./...

  binaries:
    name: static binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=${{ github.sha }}" -o dist/rsbx ./cmd/rsbx
          go build -trimpath -ldflags="-s -w -X main.version=${{ github.sha }}" -o dist/rsbxd ./cmd/rsbxd
          go build -trimpath -ldflags="-s -w" -o dist/rsbx-tramp ./cmd/rsbx-tramp
          go build -trimpath -ldflags="-s -w" -o dist/rsbx-guard ./cmd/rsbx-guard

      - name: verify the binaries are static
        run: |
          for b in dist/*; do
            if file "$b" | grep -q "dynamically linked"; then
              echo "$b is dynamically linked; the trampoline must not be"
              exit 1
            fi
          done

      - name: smoke test
        run: |
          ./dist/rsbx -version
          ./dist/rsbxd -version

      - uses: actions/upload-artifact@v4
        with:
          name: rsbx-linux-amd64
          path: dist/*
          if-no-files-found: error

  docker:
    name: docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: rsbx:ci
          build-args: |
            VERSION=${{ github.sha }}

      - name: the image runs
        run: |
          docker run --rm rsbx:ci -version

      # /dev/fuse exists here, so the mount-backed filesystem tests run for real
      # instead of skipping. This is the only place CI exercises the FUSE write
      # paths.
      - name: filesystem tests with a real mount
        run: |
          docker build --target test -t rsbx-test-env .
          docker run --rm --privileged --user 0 -v /dev/fuse:/dev/fuse \
            rsbx-test-env test ./internal/fusefs

      # A sandbox needs /dev/fuse plus an unprivileged user namespace, so the
      # container runs privileged. This exercises the real path: a daemon
      # serves a remote tree, the client mounts it over FUSE, and a local
      # shell reads a file that only exists on the daemon side.
      - name: sandbox end to end
        run: |
          mkdir -p e2e/tree e2e/localrw e2e/state/sandbox
          echo REMOTE-MARKER > e2e/tree/remote.txt
          echo LOCAL-CONTENT > e2e/localrw/local.txt
          chmod -R 777 e2e
          cat > e2e/config.toml <<'CFG'
          [daemon]
          transport = "unix"
          socket = "/e2e/state/d.sock"

          [local]
          allow = ["/usr/bin/bash", "/usr/bin/env", "/usr/bin/true",
                   "/usr/bin/ls", "/usr/bin/stat", "/usr/bin/cat"]
          paths = ["/e2e/localrw"]
          # /usr/bin holds the allowlisted commands, so it has to be local too.
          read_only_paths = ["/usr/bin", "/usr/lib", "/usr/share", "/etc", "/sys", "/dev", "/proc"]
          entry = "/usr/bin/bash"

          [sandbox]
          mount = "/e2e/state/sandbox"
          cache = "/e2e/state/cache"
          # The runner's privileged container cannot configure loopback in a
          # fresh network namespace (RTM_NEWADDR is refused), so the sandbox
          # keeps the host one. Only the network is shared; mounts, pid, ipc
          # and uts are still unshared.
          share_network = true
          # Likewise for the user namespace: the outer runtime already
          # created one, and GitHub refuses a nested uid map.
          unshare_user = false
          CFG
          # --user 0 matters: bwrap creates a pid namespace, which for a
          # non-root caller implies a user namespace, and the runner refuses
          # the uid map. As the container's root it does not need one.
          docker run --rm --privileged --user 0 \
            -v "$PWD/e2e:/e2e" -v /dev/fuse:/dev/fuse \
            --entrypoint /bin/bash rsbx:ci -c '
              mkdir -p /e2e/state/sandbox
              rsbxd -socket /e2e/state/d.sock -root /e2e/tree >/tmp/daemon.log 2>&1 &
              sleep 2
              rsbx -config /e2e/config.toml -- /usr/bin/bash -c "
                echo \"local shell: \$(readlink /proc/self/exe)\"
                echo \"local tree:  \$(cat < /e2e/localrw/local.txt)\"
                echo \"remote file: \$(/usr/bin/cat /remote.txt)\"
                # a local stat of a local tree is what makes an agent work
                echo \"local stat:  \$(/usr/bin/stat -c %s /e2e/localrw/local.txt)\"
                test \"\$(/usr/bin/cat /remote.txt)\" = REMOTE-MARKER
              "
            ' | tee out.txt
          grep -q "remote file: REMOTE-MARKER" out.txt

      # The unit tests cannot reach these: they need a live mount. The probes
      # are what a real program does to its own state files, and both patterns
      # were broken at some point.
      - name: persistence probes
        if: always()
        run: |
          # A previous run may have left root-owned files from the container.
          sudo rm -rf e2e || true
          mkdir -p e2e/probes e2e/state e2e/tree
          # Built on the runner: the image carries no compiler, and the probes
          # are static so they can run inside it either way.
          gcc -static -O1 -o e2e/probes/atomic_write testdata/probe/atomic_write.c
          gcc -static -O1 -o e2e/probes/durable_write testdata/probe/durable_write.c
          chmod 777 e2e e2e/probes e2e/state e2e/tree
          cat > e2e/probe.toml <<'CFG'
          [daemon]
          transport = "unix"
          socket = "/e2e/state/d.sock"

          [local]
          # The workload drives ordinary shell utilities; each has to run where
          # the filesystem is, which is here. Only the data they touch is remote.
          allow = ["/usr/bin", "/bin", "/e2e/probes"]
          paths = ["/e2e/state", "/e2e/probes"]
          read_only_paths = ["/usr/bin", "/usr/lib", "/usr/share", "/etc", "/sys", "/dev", "/proc"]
          entry = "/usr/bin/bash"

          [sandbox]
          mount = "/e2e/state/sandbox"
          cache = "/e2e/state/cache"
          share_network = true
          unshare_user = false
          CFG
          cat > e2e/probes/probe.sh <<'INNER'
          echo "=== atomic write (create, rename, reopen) ==="
          /e2e/probes/atomic_write /e2e/state session.jsonl
          echo "=== durable write (fsync, wal) ==="
          /e2e/probes/durable_write /e2e/state
          echo "=== workload ==="
          # /proj is the daemon's root as the sandbox sees it: rsbxd serves
          # /e2e/tree, so a project path there is remote content, which is the
          # point of the exercise.
          RSBX_PROJ=/proj /e2e/probes/workload.sh
          echo "=== semantics ==="
          RSBX_PROJ=/proj/deep /e2e/probes/semantics.sh
          echo "=== agents ==="
          RSBX_PROJ=/proj/fleet /e2e/probes/agents.sh
          echo "=== process ==="
          RSBX_PROJ=/proj/proc /e2e/probes/process.sh
          echo "=== cache ==="
          RSBX_PROJ=/proj/cache /e2e/probes/cache.sh
          echo "=== execloc ==="
          RSBX_PROJ=/e2e/probes RSBX_EXEC_DIR=/e2e/probes /e2e/probes/execloc.sh
          echo "=== runtime ==="
          RSBX_PROJ=/proj/rt /e2e/probes/runtime.sh
          INNER
          # The same probes a developer runs by hand, plus one round of an
          # agent's real project work: 23 checks covering atomic write, append,
          # truncate, links, chmod, utimes, rm -rf, sqlite, tar and git.
          cp testdata/probe/workload.sh e2e/probes/workload.sh
          cp testdata/probe/semantics.sh e2e/probes/semantics.sh
          cp testdata/probe/agents.sh e2e/probes/agents.sh
          cp testdata/probe/process.sh e2e/probes/process.sh
          cp testdata/probe/cache.sh e2e/probes/cache.sh
          cp testdata/probe/execloc.sh e2e/probes/execloc.sh
          cp testdata/probe/runtime.sh e2e/probes/runtime.sh
          chmod 777 e2e/probes/workload.sh e2e/probes/semantics.sh \
            e2e/probes/agents.sh e2e/probes/process.sh e2e/probes/cache.sh \
            e2e/probes/execloc.sh e2e/probes/runtime.sh
          docker run --rm --privileged --user 0 \
            -v "$PWD/e2e:/e2e" -v /dev/fuse:/dev/fuse \
            --entrypoint /bin/bash rsbx:ci -c '
              mkdir -p /e2e/state/sandbox
              rsbxd -socket /e2e/state/d.sock -root /e2e/tree >/tmp/d.log 2>&1 &
              sleep 2
              rsbx -config /e2e/probe.toml -- /usr/bin/bash /e2e/probes/probe.sh
            ' | tee probe-out.txt
          grep -q "reopen ok: payload" probe-out.txt
          grep -q "sqlite-like ok" probe-out.txt
          # No check may fail. A check whose program the image does not carry is
          # reported as SKIP: the slim runtime has no git or python, and that is
          # a property of the image, not of the filesystem under test.
          if grep -q "^FAIL" probe-out.txt; then
            echo "workload checks failed:"; grep "^FAIL" probe-out.txt; exit 1
          fi
          total=$(grep -cE '^(OK|SKIP)' probe-out.txt)
          test "$total" -eq 84

      # Two rsbx clients sharing one daemon tree, which is what an agent team
      # in a repo is. The single-session probes cannot exercise this; it needs
      # several mount points and concurrent clients.
      - name: concurrent sessions on one daemon
        run: |
          cp testdata/probe/dual.sh e2e/probes/dual.sh
          chmod 777 e2e/probes/dual.sh
          mkdir -p e2e/probes/cfg
          # The probe writes one config per session; only the mount and cache
          # differ, so it starts from this template.
          cat > e2e/probes/cfg/base.toml <<'CFG'
          [daemon]
          transport = "unix"
          socket = "/e2e/home/d.sock"

          [local]
          allow = ["/usr/bin", "/bin"]
          paths = []
          entry = "/usr/bin/bash"

          [sandbox]
          mount = "#MOUNT#"
          cache = "#CACHE#"
          share_network = true
          unshare_user = false
          CFG
          docker run --rm --privileged --user 0 \
            -v "$PWD/e2e:/e2e" -v /dev/fuse:/dev/fuse \
            --entrypoint /bin/bash rsbx:ci -c '
              mkdir -p /e2e/home /e2e/tree /e2e/probes/cfg
              rsbxd -socket /e2e/home/d.sock -root /e2e/tree >/tmp/d.log 2>&1 &
              sleep 2
              D=/e2e/home MNT=/e2e/home TREE=/e2e/tree \
                F=$(command -v rsbx) CFG_BASE=/e2e/probes/cfg/base.toml \
                bash /e2e/probes/dual.sh
            ' | tee dual-out.txt
          if grep -q "^FAIL" dual-out.txt; then
            echo "dual-session checks failed:"; grep "^FAIL" dual-out.txt; exit 1
          fi
          test "$(grep -c '^OK' dual-out.txt)" -eq 8

      - name: log in to ghcr
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # The same build argument the CI build uses, so the published image
          # reports the commit it was built from instead of "dev".
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
