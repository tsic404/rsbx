name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Publishing the image needs a writable package scope. Without it the token
  # is read-only and ghcr answers "installation not allowed to Create
  # organization package", which reads like a repository setting but is really
  # this block.
  packages: write

env:
  # The daemon container serves its project tree from this named volume; the
  # client container never mounts it.
  PROJ_VOL: rsbx-proj
  # Both ends reach each other through this shared socket volume. It is wiped
  # at the start of the docker job, so every run gets a clean daemon.
  RUN_VOL: rsbx-run

jobs:
  test:
    name: build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "these files are not gofmt'd:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # The sandbox itself needs unprivileged user namespaces and /dev/fuse,
      # which a normal runner does not provide. The unit tests cover the
      # policies and the protocol, so they run here; the sandbox test runs in
      # the docker job below, where the container can be given the devices.
      # The mount-backed tests in internal/fusefs need /dev/fuse, which this
      # runner does not have; they skip here and run for real in the docker job.
      - name: go test
        run: go test -race ./...

  binaries:
    name: static binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=${{ github.sha }}" -o dist/rsbx ./cmd/rsbx
          go build -trimpath -ldflags="-s -w -X main.version=${{ github.sha }}" -o dist/rsbxd ./cmd/rsbxd
          go build -trimpath -ldflags="-s -w" -o dist/rsbx-tramp ./cmd/rsbx-tramp
          go build -trimpath -ldflags="-s -w" -o dist/rsbx-guard ./cmd/rsbx-guard

      - name: verify the binaries are static
        run: |
          for b in dist/*; do
            if file "$b" | grep -q "dynamically linked"; then
              echo "$b is dynamically linked; the trampoline must not be"
              exit 1
            fi
          done

      - name: smoke test
        run: |
          ./dist/rsbx -version
          ./dist/rsbxd -version

      - uses: actions/upload-artifact@v4
        with:
          name: rsbx-linux-amd64
          path: dist/*
          if-no-files-found: error

  docker:
    name: docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: rsbx:ci
          build-args: |
            VERSION=${{ github.sha }}

      - name: the image runs
        run: |
          docker run --rm rsbx:ci -version

      # /dev/fuse exists here, so the mount-backed filesystem tests run for real
      # instead of skipping. This is the only place CI exercises the FUSE write
      # paths. The test container is disposable; the image is the same slim one
      # the daemon and client run from, plus the Go toolchain of the build stage.
      - name: filesystem tests with a real mount
        run: |
          docker build --target test -t rsbx-test-env .
          docker run --rm --privileged --user 0 -v /dev/fuse:/dev/fuse \
            rsbx-test-env test ./internal/fusefs

      # Every end-to-end job below has the same shape: the daemon runs in its
      # own disposable container with a throwaway project volume mounted at
      # /proj — that mount IS the remote tree, native paths, no root argument —
      # and the client runs in a second container that shares only the socket
      # volume and its own scratch state. The client never binds the project:
      # its only view of /proj is the one the daemon serves.
      #
      # The containers talk to each other on a shared docker network, so the
      # client reaches the daemon's socket through the run volume.

      # A sandbox needs /dev/fuse plus an unprivileged user namespace, so the
      # client container runs privileged. This exercises the real path: a
      # daemon serves its own /proj, the client mounts it over FUSE, and a
      # local shell reads a file that only exists on the daemon side.
      - name: sandbox end to end
        run: |
          docker network create rsbx-e2e
          docker volume rm "$RUN_VOL" 2>/dev/null || true
          docker volume create "$PROJ_VOL"
          docker volume create "$RUN_VOL"
          docker run -d --rm --name rsbxd --network rsbx-e2e \
            -v "$PROJ_VOL":/proj -v "$RUN_VOL":/run/rsbx \
            --entrypoint rsbxd rsbx:ci -socket /run/rsbx/daemon.sock
          # the client waits for the socket instead of a fixed sleep: as soon
          # as it answers, the daemon is up
          docker run --rm --network rsbx-e2e -v "$RUN_VOL":/run/rsbx \
            --entrypoint /bin/bash rsbx:ci -c '
              for i in $(seq 1 50); do [ -S /run/rsbx/daemon.sock ] && exit 0; sleep 0.2; done
              echo "daemon socket never appeared"; exit 1
            '
          # Scratch state lives in a second named volume: configs, cache and
          # mount points. Nothing on it is a project file.
          docker volume create rsbx-state
          docker run --rm --privileged --network rsbx-e2e \
            -v "$RUN_VOL":/run/rsbx -v rsbx-state:/e2e/state \
            --entrypoint /bin/bash rsbx:ci -c '
              mkdir -p /e2e/state/sandbox /e2e/state/cache
              cat > /e2e/state/config.toml <<CFG
              [daemon]
              transport = "unix"
              socket = "/.rsbx-rpc/daemon.sock"

              [local]
              allow = []
              entry = "/bin/sh"

              [sandbox]
              mount = "/e2e/state/sandbox"
              cache = "/e2e/state/cache"
              # The privileged client container cannot configure loopback in a
              # fresh network namespace (RTM_NEWADDR is refused), so the
              # sandbox keeps the host one. Only the network is shared; mounts,
              # pid, ipc and uts are still unshared.
              share_network = true
              # The outer runtime already created the user namespace, and
              # GitHub refuses a nested uid map.
              unshare_user = false
              CFG
              rsbx -config /e2e/state/config.toml -- /bin/sh -c "
                echo \"remote file: \$(cat /proj/remote.txt)\"
                test \"\$(cat /proj/remote.txt)\" = REMOTE-MARKER
              "
            ' | tee out.txt
          grep -q "remote file: REMOTE-MARKER" out.txt

      # The unit tests cannot reach these: they need a live mount. The probes
      # are what a real program does to its own state files, and both patterns
      # were broken at some point.
      - name: persistence probes
        if: always()
        run: |
          # A previous run may have left root-owned files in the volumes.
          docker volume rm "$RUN_VOL" rsbx-state 2>/dev/null || true
          docker volume create "$PROJ_VOL"
          docker volume create "$RUN_VOL"
          docker volume create rsbx-state
          # The probes are built on the runner: the image carries no compiler,
          # and the binaries are static so they can run inside it either way.
          docker run --rm -v "$PWD:/host" -w /host gcc:13 \
            sh -c 'gcc -static -O1 -o /host/e2e/probes/atomic_write testdata/probe/atomic_write.c \
                   && gcc -static -O1 -o /host/e2e/probes/durable_write testdata/probe/durable_write.c'
          chmod 777 e2e/probes
          # Seed the daemon's project volume. The client side never mounts it.
          docker run --rm -v "$PROJ_VOL":/seed -v "$PWD/e2e:/e2e" \
            --entrypoint /bin/bash rsbx:ci -c 'cp /e2e/probes/* /seed/ && chmod 777 /seed/*'
          cat > e2e/probe.toml <<'CFG'
          [daemon]
          transport = "unix"
          socket = "/.rsbx-rpc/daemon.sock"

          [local]
          # The workload drives ordinary shell utilities; each has to run where
          # the filesystem is. Inside the sandbox that is the daemon: /proj and
          # its tools are one tree, so nothing is allowlisted locally. Only the
          # probe binaries live on the client's scratch volume.
          allow = []
          entry = "/bin/sh"

          [sandbox]
          mount = "/e2e/state/sandbox"
          cache = "/e2e/state/cache"
          share_network = true
          unshare_user = false
          CFG
          # The same probes a developer runs by hand: workload, semantics,
          # agents, process, cache, execloc and runtime, driven by one script.
          # RSBX_PROJ is the daemon's native /proj/probe path — a disposable
          # directory on the throwaway volume the daemon container serves.
          docker run --rm --privileged --network rsbx-e2e \
            -v "$RUN_VOL":/run/rsbx -v rsbx-state:/e2e/state \
            --entrypoint /bin/bash rsbx:ci -c '
              mkdir -p /e2e/state/sandbox /e2e/state/cache
              rsbx -config /e2e/probe.toml -- /bin/sh -c "
                RSBX_PROJ=/proj/probe/run /proj/probe/workload.sh
                RSBX_PROJ=/proj/probe/deep /proj/probe/semantics.sh
                RSBX_PROJ=/proj/probe/fleet /proj/probe/agents.sh
                RSBX_PROJ=/proj/probe/proc /proj/probe/process.sh
                RSBX_PROJ=/proj/probe/cache /proj/probe/cache.sh
                RSBX_PROJ=/proj/probe/exec RSBX_EXEC_DIR=/e2e/probes /proj/probe/execloc.sh
                RSBX_PROJ=/proj/probe/rt /proj/probe/runtime.sh
              "
            ' | tee probe-out.txt
          grep -q "reopen ok: payload" probe-out.txt
          grep -q "sqlite-like ok" probe-out.txt
          # No check may fail. A check whose program the image does not carry is
          # reported as SKIP: the slim runtime has no git or python, and that is
          # a property of the image, not of the filesystem under test.
          if grep -q "^FAIL" probe-out.txt; then
            echo "workload checks failed:"; grep "^FAIL" probe-out.txt; exit 1
          fi
          total=$(grep -cE '^(OK|SKIP)' probe-out.txt)
          test "$total" -eq 84

      # Two rsbx clients sharing one daemon tree, which is what an agent team
      # in a repo is. The single-session probes cannot exercise this; it needs
      # several mount points and concurrent clients. Both clients run in their
      # own container against the same daemon socket; neither mounts /proj.
      - name: concurrent sessions on one daemon
        run: |
          docker volume rm "$RUN_VOL" rsbx-state 2>/dev/null || true
          docker volume create "$PROJ_VOL"
          docker volume create "$RUN_VOL"
          docker volume create rsbx-state
          docker network create rsbx-dual
          docker run -d --rm --name rsbxd --network rsbx-dual \
            -v "$PROJ_VOL":/proj -v "$RUN_VOL":/run/rsbx \
            --entrypoint rsbxd rsbx:ci -socket /run/rsbx/daemon.sock
          docker run --rm --network rsbx-dual -v "$RUN_VOL":/run/rsbx \
            --entrypoint /bin/bash rsbx:ci -c '
              for i in $(seq 1 50); do [ -S /run/rsbx/daemon.sock ] && exit 0; sleep 0.2; done
              echo "daemon socket never appeared"; exit 1
            '
          # Copy the probe in, then run it: one container hosts the two client
          # sessions because they need a shared MNT scratch home.
          docker run --rm --privileged --network rsbx-dual \
            -v "$RUN_VOL":/run/rsbx -v rsbx-state:/e2e/state \
            -v "$PWD/testdata/probe/dual.sh:/probe/dual.sh:ro" \
            --entrypoint /bin/bash rsbx:ci -c '
              mkdir -p /e2e/state/cfg
              cat > /e2e/state/cfg/base.toml <<CFG
              [daemon]
              transport = "unix"
              socket = "/.rsbx-rpc/daemon.sock"

              [local]
              allow = []
              entry = "/bin/sh"

              [sandbox]
              mount = "#MOUNT#"
              cache = "#CACHE#"
              share_network = true
              unshare_user = false
              CFG
              chmod 777 /e2e/state
              D=/e2e/state MNT=/e2e/state TREE=/proj \
                F=$(command -v rsbx) CFG_BASE=/e2e/state/cfg/base.toml \
                bash /probe/dual.sh
            ' | tee dual-out.txt
          if grep -q "^FAIL" dual-out.txt; then
            echo "dual-session checks failed:"; grep "^FAIL" dual-out.txt; exit 1
          fi
          test "$(grep -c '^OK' dual-out.txt)" -eq 8

      - name: log in to ghcr
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # The same build argument the CI build uses, so the published image
          # reports the commit it was built from instead of "dev".
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
